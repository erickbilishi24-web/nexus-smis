name: Build NEXUS APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/build-android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-SMIS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to dist/ for easy download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NEXUS-SMIS.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/NEXUS-SMIS.apk
          git commit -m "Build NEXUS-SMIS.apk" || exit 0
          git push
