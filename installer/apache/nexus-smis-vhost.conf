# NEXUS SMIS Apache vhost. Enable proxy_module, proxy_http_module, and rewrite_module.
<VirtualHost *:80>
    ServerName nexus-smis.local
    # Apache serves the built React files copied by Install-Nexus.ps1.
    # Add the host computer name or LAN IP as ServerAlias during deployment if desired.
    ServerAlias localhost
    DocumentRoot "C:/NEXUS-SMIS/current/public"
    <Directory "C:/NEXUS-SMIS/current/public">
        AllowOverride All
        Require all granted
    </Directory>
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
    ErrorLog "logs/nexus-smis-error.log"
    CustomLog "logs/nexus-smis-access.log" common
</VirtualHost>
